# Testa e publica o WALL Finance no Cloudflare Pages (plano gratuito).
# Segredos necessários em GitHub → Settings → Secrets and variables → Actions:
#   CLOUDFLARE_API_TOKEN  (permissões: Cloudflare Pages:Edit e D1:Edit)
#   CLOUDFLARE_ACCOUNT_ID
#   D1_DATABASE_ID        (ID do banco "wall-finance")
# Os segredos do app (OWNER_EMAIL, OWNER_PASSWORD_HASH) ficam SOMENTE na Cloudflare, nunca aqui.
name: Testar e publicar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - name: Navegador para o teste ponta a ponta
        run: npx playwright-core install --with-deps chromium
      - run: npm run test:e2e
        env: { CHROMIUM_PATH: "" }

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Verificar segredos
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DBID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ] || [ -z "$DBID" ]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID e D1_DATABASE_ID (veja o README)."; exit 1
          fi
      - run: npm ci
      - name: Apontar para o banco D1
        run: sed -i "s/00000000-0000-0000-0000-000000000000/${{ secrets.D1_DATABASE_ID }}/" wrangler.toml
      - run: npm run build
      - name: Migrações do banco
        run: npx wrangler d1 migrations apply wall-finance --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Publicar
        run: npx wrangler pages deploy public --project-name wall-finance --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
